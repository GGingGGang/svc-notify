name: svc-notify tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: notify
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: notify
      NOTIFY_MYSQL_TEST: "1"
      NATS_URL: nats://127.0.0.1:4222
      NOTIFY_NATS_TEST: "1"
      APP_ENV: test
      MYSQL_TLS_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: docker run -d --name notify-nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -m 8222
      - run: for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8222/healthz; then exit 0; fi; sleep 1; done; exit 1
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
